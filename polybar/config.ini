[colors]
background = #000000
background-alt = #373B41
foreground = #A3A3A3
primary = #5FB4DE 
secondary = #B4B4C1
alert = #A54242
disabled = #696969
dots = #4F4F4F

[bar/example]
width = 100%
height = 24pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = " "
separator-foreground = ${colors.dots}

#=========================================================================
#                               FONTS
#=========================================================================

#font-0 = monospace;2
font-0 = mesloLGS NF;1 
font-1 = "3270 Nerd Font Mono:style=Regular:size=15;2"


#=========================================================================
#                              WORKSPACE
#=========================================================================

modules-left = xworkspaces xwindow
modules-center =
modules-right = updates-pacman-aurhelper filesystem pulseaudio vpn-openvpn-status wlan date
#modules-right = filesystem pulseaudio memory cpu wlan eth date xkeyboard



cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

#=========================================================================
#                                ADDONS
#=========================================================================

[module/updates-pacman-aurhelper]
type = custom/script
exec = /home/emmyvinte/.config/polybar/scripts/updates-pacman-aurhelper.sh
interval = 100
#label = 󰏔

[module/vpn-openvpn-status]
type = custom/script
exec = /home/emmyvinte/.config/polybar/scripts/vpn-openvpn-status.sh
interval = 2


# [module/network-networkmanager]
# type = custom/script
# exec = /home/emmyvinte/.config/polybar/scripts/network-networkmanager.sh
# tail = true

# [module/info-kernel]
# type = custom/script
# exec = uname -r
# interval = 1024


#=========================================================================
#                           DEFAULT MODULES
#=========================================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#5FB4DE}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#696969}%ifname%%{F-}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#5FB4DE}%ifname%%{F-} %local_ip%
#label-connected = %{F#5FB4DE}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#5FB4DE}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
#label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
